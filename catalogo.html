<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CiberShield - Catálogo de Productos</title>
  <link rel="stylesheet" href="./css/catalogo.css">
</head>
<body>

  <header style="position: relative;">
    <!-- Recuadro para cambiar de idioma -->
    <div class="rincon-castigo">
      <select id="selector-idioma" onchange="cambiarIdioma(this.value)">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="nav-container">
      <div class="logo-box">
        <div class="logo-icon">
          <img src="img/logo-cibershelf.png" alt="Logo CiberShield">
        </div>
        <span class="logo-text" data-i18n="logo_texto">CIBERSHIELD</span>
      </div>

      <nav>
        <ul>
          <li><a href="index.html" data-i18n="menu_inicio">INICIO</a></li>
          <li><a href="catalogo.html" class="active" data-i18n="menu_catalogo">CATÁLOGO</a></li>
          <li><a href="servicios.html" data-i18n="menu_servicios">SERVICIOS</a></li>
          <li><a href="nosotros.html" data-i18n="menu_nosotros">NOSOTROS</a></li>
          <li><a href="contacto.html" data-i18n="menu_contacto">CONTACTO</a></li>
          
          <!-- Contenedor dinámico para la sesión -->
          <span id="auth-container" style="display: contents;">
            <li><a href="formulario registro.html" data-i18n="menu_registro">REGISTRO</a></li>
            <li><a href="login.html" data-i18n="menu_login">INICIAR SESIÓN</a></li>
          </span>
          
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- Grilla de Productos -->
    <div class="cards-grid">
      <!-- Producto 1 -->
      <div class="card">
        <div class="image-placeholder">
          <img src="img/Antivirus Pro.jpg" alt="Antivirus Pro">
        </div>
        <h3 data-i18n="cat_prod_1">Antivirus Pro</h3>
        <div class="card-footer">
          <span class="price">S/ 89</span>
          <button class="btn btn-agregar" data-nombre="Antivirus Pro" data-precio="89" data-i18n="cat_btn">AGREGAR</button>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="card">
        <div class="image-placeholder">
          <img src="img/Antivirus Hogar.jpg" alt="Antivirus Hogar">
        </div>
        <h3 data-i18n="cat_prod_1">Antivirus Hogar</h3>
        <div class="card-footer">
          <span class="price">S/ 59</span>
          <button class="btn btn-agregar" data-nombre="Antivirus Hogar" data-precio="59" data-i18n="cat_btn">AGREGAR</button>
        </div>
      </div>

      <!-- Producto 3 -->
      <div class="card">
        <div class="image-placeholder">
          <img src="img/VPN Seguros.jpg" alt="VPN Segura">
        </div>
        <h3 data-i18n="cat_prod_2">VPN Segura</h3>
        <div class="card-footer">
          <span class="price">S/ 120</span>
          <button class="btn btn-agregar" data-nombre="VPN Segura" data-precio="120" data-i18n="cat_btn">AGREGAR</button>
        </div>
      </div>

      <!-- Producto 4 -->
      <div class="card">
        <div class="image-placeholder">
          <img src="img/Firewall Empresarial.jpg" alt="Firewall Empresarial">
        </div>
        <h3 data-i18n="cat_prod_3">Firewall Empresarial</h3>
        <div class="card-footer">
          <span class="price">S/ 1,500</span>
          <button class="btn btn-agregar" data-nombre="Firewall Empresarial" data-precio="1500" data-i18n="cat_btn">AGREGAR</button>
        </div>
      </div>

      <!-- Producto 5 -->
      <div class="card">
        <div class="image-placeholder">
          <img src="img/Firewall Basico.jpg" alt="Firewall Básico">
        </div>
        <h3 data-i18n="cat_prod_4">Firewall Básico</h3>
        <div class="card-footer">
          <span class="price">S/ 600</span>
          <button class="btn btn-agregar" data-nombre="Firewall Básico" data-precio="600" data-i18n="cat_btn">AGREGAR</button>
        </div>
      </div>

      <!-- Producto 6 -->
      <div class="card">
        <div class="image-placeholder">
          <img src="img/Llaves USB.jpg" alt="Llave USB">
        </div>
        <h3 data-i18n="cat_prod_5">Llave USB</h3>
        <div class="card-footer">
          <span class="price">S/ 150</span>
          <button class="btn btn-agregar" data-nombre="Llave USB" data-precio="150" data-i18n="cat_btn">AGREGAR</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p data-i18n="footer_texto">© 2026 CiberShield · Lima, Perú</p>
  </footer>

  <!-- Scripts JS -->
  <script src="./js/efectos.js"></script>
  <script src="./js/menu.js"></script>
  <script src="./js/chatboot.js?v=1"></script>
  <script src="./js/carrito.js"></script>
  <script src="./js/traductor.js"></script>

</body>
</html>
