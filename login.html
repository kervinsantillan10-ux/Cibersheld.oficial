<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CiberShield</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <div class="logo-badge">CS</div>
            <h1>CiberShield</h1>
            <p class="subtitle">Inicia sesión en tu cuenta segura</p>
        </div>

        <form action="usuario.html" method="GET">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="contraseña" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <a href="index.html" class="back-home">← Volver al inicio</a>
    </div>
<script src="./js/efectos.js"></script>
<!-- Enlace al script del menú dinámico -->
<script src="./js/menu.js"></script>
<script>
    // Busca tu botón de ingreso
    const btnIngresar = document.querySelector('button[type="submit"]');
    
    if(btnIngresar) {
        btnIngresar.addEventListener('click', function() {
            // Guarda la sesión
            localStorage.setItem('cs_username', 'Cesar Luis');
        });
    }
    // Guarda el nombre ingresado por el usuario en el input 'reg_nombre'
localStorage.setItem('userName', document.getElementById('reg_nombre').value);
</script>
<script src="./js/chatboot.js"></script>
</body>
</html>
